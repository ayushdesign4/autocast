name: Daily 1990s Nostalgia YouTube Short

on:
  schedule:
    # 22:30 UTC daily = 04:00 AM IST (Indian Standard Time, UTC + 5:30) on the following day
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional custom story topic (leave blank to select from pool)"
        required: false
        default: ""
      upload:
        description: "Upload to YouTube (true/false)"
        required: false
        default: "true"
      privacy:
        description: "YouTube privacy status (private / unlisted / public)"
        required: false
        default: "private"

# Prevent concurrent runs from clashing or uploading duplicate videos at the same time
concurrency:
  group: youtube-shorts-daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run ZeroCost Shorts Pipeline
        id: pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          RUN_DATE="$(date -u +%F)"
          RUN_ID="${RUN_DATE}-${{ github.run_id }}"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

          # Default to upload for scheduled runs, respect input for dispatch
          UPLOAD_FLAG="--upload"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.upload }}" = "false" ]; then
            UPLOAD_FLAG=""
          fi

          TOPIC_FLAG=""
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            TOPIC_FLAG="--topic \"${{ github.event.inputs.topic }}\""
          fi

          PRIVACY="${{ github.event.inputs.privacy || 'private' }}"

          echo "Executing pipeline for 90s Indian Nostalgia (run_id: $RUN_ID, upload: $UPLOAD_FLAG, privacy: $PRIVACY)..."
          python scripts/run_short.py --channel 90s_indian_nostalgia $UPLOAD_FLAG --privacy "$PRIVACY" --run-id "$RUN_ID" $TOPIC_FLAG

      - name: Commit history & state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output/history/ || true
          git commit -m "chore(history): update topic & upload state [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main || echo "Failed to push history update"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-run-output-${{ env.RUN_ID || github.run_id }}
          path: |
            output/runs/
            data/
          retention-days: 14
