[project]
name = "zerocost-shorts"
version = "0.1.0"
description = "Automated daily 1990s Indian Nostalgia vertical YouTube Shorts pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.4.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.130.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
